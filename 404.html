<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page not found - Annika Lee</title><style>
:root{
  --bg:#f5f0e8;
  --bg2:#ebe2d7;
  --ink:#1d1b19;
  --muted:#67615b;
  --line:rgba(29,27,25,.16);
  --accent:#8b4753;
  --dark:#23211f;
  --white:#fffaf4;
  --max:1400px;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65}
img{display:block;width:100%;height:100%;object-fit:cover}
a{color:inherit;text-decoration:none}
button{font:inherit}
.shell{width:min(calc(100% - 64px),var(--max));margin:0 auto}

/* Sticky navigation */
.site-header{position:sticky;top:0;z-index:1000;background:rgba(245,240,232,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav-inner{width:min(calc(100% - 64px),var(--max));margin:0 auto;min-height:78px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:28px}
.wordmark{font-size:17px;font-weight:800;letter-spacing:.12em}
.nav-links{display:flex;align-items:center;gap:32px;font-size:14px;font-weight:650}
.nav-links a{position:relative;padding:8px 0}
.nav-links a:after{content:"";position:absolute;left:0;bottom:2px;width:0;height:1px;background:var(--ink);transition:.25s}
.nav-links a:hover:after,.nav-links a.active:after{width:100%}
.nav-cta{justify-self:end;font-size:13px;font-weight:750;letter-spacing:.03em}
.menu-btn{display:none;border:1px solid var(--line);background:transparent;padding:9px 12px}

/* type */
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.17em;font-weight:800;color:var(--accent)}
h1,h2,h3,p{margin-top:0}
.display,.section-title,.case-title,.case-copy h2,.work-intro h1,.contact-title{font-family:var(--serif);font-weight:400;letter-spacing:-.045em}
.muted{color:var(--muted)}

/* Home */
.hero{padding:74px 0 110px}
.hero-topline{display:flex;justify-content:space-between;gap:20px;padding-bottom:34px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:750}
.hero-grid{display:grid;grid-template-columns:.88fr 1.12fr;gap:clamp(48px,7vw,110px);align-items:center;padding-top:48px}
.display{font-size:clamp(68px,8vw,128px);line-height:.87;margin-bottom:30px}
.display em{display:block;color:var(--accent);font-style:italic}
.hero-copy{max-width:680px;font-size:20px;line-height:1.55}
.hero-actions{display:flex;gap:22px;align-items:center;margin-top:34px;flex-wrap:wrap}
.text-link{display:inline-flex;align-items:center;gap:13px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;border-bottom:1px solid var(--ink);padding-bottom:7px}

.text-link:hover span{transform:translateX(5px)}
.hero-photo-wrap{position:relative;aspect-ratio:4/5;background:#d8c7b8}

.hero-mini{position:absolute;width:31%;aspect-ratio:1;right:-2%;top:10%;border:7px solid var(--bg);overflow:hidden;box-shadow:0 12px 32px rgba(38,31,27,.12)}

.section{padding:105px 0}
.section-head{display:grid;grid-template-columns:1.2fr .8fr;gap:80px;align-items:end;margin-bottom:46px}
.section-title{font-size:clamp(50px,6vw,88px);line-height:.94;margin-bottom:0}
.section-intro{font-size:18px;color:var(--muted);margin-bottom:5px;max-width:570px}

.featured-grid{display:grid;grid-template-columns:1fr 1fr;gap:52px 28px}

.project-meta{display:grid;grid-template-columns:48px 1fr auto;gap:16px;padding-top:17px;border-top:1px solid var(--line);margin-top:12px}

.more-work{display:flex;justify-content:flex-end;margin-top:50px}

.image-ribbon{width:100vw;margin-left:calc(50% - 50vw);display:grid;grid-template-columns:1.1fr .8fr 1fr 1.1fr;gap:5px;background:var(--dark);padding:5px}

.image-ribbon a:after{content:attr(data-label);position:absolute;left:13px;bottom:13px;background:rgba(29,27,25,.76);color:#fff;padding:8px 10px;font-size:9px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}

.image-ribbon a:hover img{transform:scale(1.03)}

.about-section{background:var(--bg2)}

.tags{display:flex;flex-wrap:wrap;gap:9px;margin-top:28px}

.experience-list{border-top:1px solid var(--line)}
.exp-row{display:grid;grid-template-columns:130px 1.15fr 1fr;gap:30px;padding:24px 0;border-bottom:1px solid var(--line);align-items:baseline}
.exp-row time{font-family:var(--serif);font-size:17px}
.exp-row strong{font-size:15px}
.exp-row span{font-size:14px;color:var(--muted)}

.skills{background:var(--dark);color:var(--white)}
.skills .section-title em{color:#d9a1a8;font-style:italic}
.skill-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:55px;border-top:1px solid rgba(255,255,255,.18)}

.skill-grid article+article{padding-left:30px}
.skill-grid article:last-child{border-right:0}
.skill-grid span{font-size:11px;color:#d9a1a8;font-weight:800;letter-spacing:.12em}
.skill-grid h3{font-family:var(--serif);font-weight:400;font-size:31px;margin:22px 0 10px}
.skill-grid p{color:rgba(255,250,244,.66);font-size:15px}

.contact{padding:110px 0 80px}
.contact-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:80px;align-items:end}
.contact-title{font-size:clamp(60px,7vw,108px);line-height:.9;margin:0}
.contact-title em{color:var(--accent);font-style:italic}
.contact-links{display:grid;border-top:1px solid var(--line)}
.contact-links a{display:flex;justify-content:space-between;padding:17px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:750}
.footer{padding:24px 0 35px;border-top:1px solid var(--line);font-size:11px;display:flex;justify-content:space-between;color:var(--muted)}

/* Work index */
.work-intro{padding:72px 0 76px;border-bottom:1px solid var(--line)}
.work-intro h1{font-size:clamp(68px,9vw,132px);line-height:.88;margin-bottom:30px}
.work-intro h1 em{color:var(--accent);font-style:italic}
.work-intro p{max-width:750px;font-size:19px;color:var(--muted)}
.work-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:58px 30px;padding:70px 0 120px}
.work-grid .project-card:nth-child(3n+1) .project-image{aspect-ratio:16/10}
.work-note{display:inline-flex;gap:9px;align-items:center;margin-top:18px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--accent)}

/* Case pages */
.case-hero{padding:62px 0 90px}
.case-topline{display:flex;justify-content:space-between;gap:20px;font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:800;margin-bottom:38px}
.case-title{font-size:clamp(68px,9vw,138px);line-height:.86;margin:0 0 58px}

.case-hero-grid{display:grid;grid-template-columns:.72fr 1.28fr;gap:70px;align-items:center}
.case-lede{font-family:var(--serif);font-size:clamp(28px,3.1vw,46px);line-height:1.22}
.case-note{font-size:14px;color:var(--muted);margin-top:24px}
.case-cover{aspect-ratio:16/10;overflow:hidden;background:#ddd4c9;box-shadow:0 22px 60px rgba(34,28,24,.11)}
.case-cover.contain img{object-fit:contain;background:#fff}

.case-label:after{content:"";display:block;width:38px;height:2px;background:var(--accent);margin-top:15px;opacity:.6}

.case-copy>p{max-width:900px;font-size:18px;color:var(--muted)}
.case-copy .lead{color:var(--ink);font-size:20px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:46px}
.stat{border-top:1px solid var(--line);padding-top:18px;min-height:150px}
.stat strong{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(42px,4vw,62px);line-height:1;color:var(--accent)}
.stat span{display:block;font-size:12px;color:var(--muted);line-height:1.45;margin-top:10px}
.visual-band{width:100vw;margin-left:calc(50% - 50vw);background:#ebe5dc;padding:70px max(20px,calc((100vw - min(calc(100vw - 64px),var(--max)))/2))}
.visual-grid{max-width:var(--max);margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:24px}

.visual{margin:0;background:#fff;box-shadow:0 18px 48px rgba(34,28,24,.1);overflow:hidden}

.visual figcaption{padding:14px 16px 16px;font-size:12px;line-height:1.5;color:var(--muted)}
.visual.feature{grid-column:1/-1}

.process{padding:24px 0;border-top:1px solid var(--line)}
.process span{font-family:var(--serif);font-size:18px;color:var(--accent)}
.process h3{font-size:19px;margin:10px 0 8px}
.process p{font-size:15px;color:var(--muted);margin:0}
.callout{background:var(--dark);color:var(--white);padding:38px 40px;margin-top:42px;max-width:900px}
.callout span{display:block;color:#d9a1a8;font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:800}
.callout strong{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(34px,4vw,54px);line-height:1.05;margin:14px 0}
.callout p{color:rgba(255,250,244,.68);margin:0;font-size:15px}
.case-pagination{display:flex;justify-content:space-between;gap:30px;padding:42px 0 80px;border-top:1px solid var(--line);font-size:14px;font-weight:750}
.case-pagination a{display:flex;gap:10px;align-items:center}

/* per-case accents */
.case-azilis{--accent:#7b636b}.case-padel{--accent:#49743d}.case-tuff{--accent:#667366}.case-shed{--accent:#856154}.case-bec{--accent:#176ea6}.case-luma{--accent:#3471a9}.case-please{--accent:#cf673e}.case-social{--accent:#8b4753}.case-events{--accent:#a66f38}
.case-padel .visual-band{background:#e7ede2}.case-tuff .visual-band{background:#e5e9e3}.case-shed .visual-band{background:#ebe1da}.case-bec .visual-band{background:#e5eef2}.case-luma .visual-band{background:#e6eef5}.case-please .visual-band{background:#f0e4da}

/* mobile */
@media(max-width:950px){
  .shell,.nav-inner{width:min(calc(100% - 40px),var(--max))}
  .nav-inner{grid-template-columns:1fr auto}
  .nav-links{position:absolute;left:20px;right:20px;top:70px;display:none;flex-direction:column;align-items:stretch;gap:0;background:var(--bg);border:1px solid var(--line);padding:10px 18px;box-shadow:0 18px 40px rgba(34,28,24,.12)}

  .section-head{grid-template-columns:1fr;gap:18px}

  .exp-row{grid-template-columns:110px 1fr}

  .stat-grid{grid-template-columns:1fr 1fr}
  .visual-grid.three{grid-template-columns:1fr 1fr}
  .work-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:680px){
  body{font-size:16px}.shell,.nav-inner{width:min(calc(100% - 26px),var(--max))}.nav-inner{min-height:68px}
  .hero{padding:46px 0 74px}.hero-topline{font-size:9px}.display{font-size:clamp(58px,18vw,88px)}
  .hero-mini{width:35%;right:0}.section{padding:75px 0}.section-title{font-size:clamp(46px,14vw,66px)}

  .exp-row{grid-template-columns:1fr;gap:7px}.exp-row span{grid-column:auto}.skill-grid{grid-template-columns:1fr}.skill-grid article,.skill-grid article+article{border-right:0;border-bottom:1px solid rgba(255,255,255,.14);padding:28px 0;min-height:0}
  .contact-title{font-size:clamp(58px,18vw,82px)}
  .work-intro{padding:48px 0}.work-intro h1{font-size:clamp(60px,18vw,92px)}
  .case-hero{padding:42px 0 68px}.case-topline{font-size:9px;gap:8px}.case-title{font-size:clamp(58px,18vw,92px);margin-bottom:38px}.case-lede{font-size:27px}
  .case-block{grid-template-columns:1fr;gap:22px;padding:72px 0}.case-copy h2{font-size:clamp(38px,12vw,56px)}.case-copy>p{font-size:16px}
  .stat-grid{grid-template-columns:1fr 1fr;gap:12px}.stat{min-height:130px}.stat strong{font-size:44px}
  .visual-band{padding:34px 13px}.visual-grid,.visual-grid.three{grid-template-columns:1fr;gap:16px}.visual.feature{grid-column:auto}.process-grid{grid-template-columns:1fr}
  .case-pagination{font-size:12px}
}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s ease}.reveal.in{opacity:1;transform:none}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.reveal{opacity:1;transform:none;transition:none}}

/* Reliability: content stays visible if JavaScript is blocked or a browser skips animations. */
.reveal{opacity:1;transform:none}
.js .reveal{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s ease}
.js .reveal.in{opacity:1;transform:none}

/* Robust hero image layout: no absolute positioning required for the main portrait. */
.hero-photo-wrap{padding:0 7% 8% 0;min-height:560px}
.hero-photo{position:relative;inset:auto;width:100%;height:100%;min-height:560px}
@media(max-width:950px){.hero-photo-wrap,.hero-photo{min-height:620px}}
@media(max-width:680px){.hero-photo-wrap,.hero-photo{min-height:470px}}

</style></head><body><header class="site-header"><div class="nav-inner"><a class="wordmark" href="index.html">ANNIKA LEE</a><nav class="nav-links" aria-label="Main navigation"><a href="work.html">Work</a><a href="index.html#about">About</a><a href="index.html#experience">Experience</a><a href="index.html#contact">Contact</a></nav><button class="menu-btn" aria-label="Open menu" aria-expanded="false">Menu</button><a class="nav-cta" href="mailto:annikalee.work@gmail.com">Available for opportunities →</a></div></header><main class="shell work-intro"><span class="kicker">404</span><h1>Not found.<br><em>Still curious?</em></h1><p>That page does not exist, but the work does.</p><a class="text-link" href="work.html">View work <span>→</span></a></main><footer class="footer shell"><span>© <span data-year></span> Annika Lee</span><a href="#top">Back to top ↑</a></footer><script>
document.documentElement.classList.add('js');
const menuBtn=document.querySelector('.menu-btn');
const nav=document.querySelector('.nav-links');
if(menuBtn&&nav){menuBtn.addEventListener('click',()=>{nav.classList.toggle('open');menuBtn.setAttribute('aria-expanded',nav.classList.contains('open'));});nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>nav.classList.remove('open')));}
const year=document.querySelectorAll('[data-year]');year.forEach(el=>el.textContent=new Date().getFullYear());

document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));
